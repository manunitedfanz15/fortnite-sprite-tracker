<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101522">
<title>Fortnite Sprite Tracker</title>
<style>
:root {
  color-scheme: dark;
  --bg:#101522;
  --panel:#1a2233;
  --panel2:#222d42;
  --line:#34415a;
  --text:#f3f6ff;
  --muted:#9ba9c2;
  --blue:#65a7ff;
  --green:#43d69a;
}
* { box-sizing:border-box; }
body {
  margin:0;
  padding:20px;
  padding-bottom:calc(25px + env(safe-area-inset-bottom));
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
.container { max-width:1250px; margin:auto; }
header { margin-bottom:20px; }
h1 { margin:0 0 6px; font-size:29px; }
.subtitle { color:var(--muted); font-size:14px; }
.stats {
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:9px;
  margin:20px 0;
}
.stat {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 9px;
  min-width:0;
}
.stat span {
  display:block;
  color:var(--muted);
  font-size:11px;
  font-weight:bold;
  white-space:nowrap;
}
.stat b { display:block; font-size:20px; margin-top:7px; }
.progress {
  height:6px;
  border-radius:10px;
  background:#35415a;
  margin-top:9px;
  overflow:hidden;
}
.progress div {
  height:100%;
  width:0;
  background:var(--green);
  transition:width .2s;
}
.tabs {
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:9px;
  margin-bottom:12px;
  scrollbar-width:thin;
}
.tab,.filter {
  border:1px solid var(--line);
  color:var(--text);
  background:var(--panel);
  border-radius:9px;
  padding:10px 14px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
  white-space:nowrap;
}
.tab.active,.filter.active {
  background:#24538a;
  border-color:var(--blue);
}
.controls {
  display:grid;
  grid-template-columns:minmax(180px,2fr) repeat(2,minmax(120px,1fr));
  gap:9px;
  margin-bottom:12px;
}
input,select {
  width:100%;
  min-width:0;
  padding:12px;
  color:var(--text);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:9px;
  font-size:14px;
}
.view-filters {
  display:flex;
  gap:7px;
  margin-bottom:17px;
  overflow-x:auto;
}
.cards {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(255px,1fr));
  gap:13px;
}
.sprite-card {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px;
  min-width:0;
}
.sprite-top {
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:12px;
}
.sprite-image {
  width:83px;
  height:83px;
  flex-shrink:0;
  border-radius:10px;
  object-fit:contain;
  background:#111a2a;
  border:1px solid var(--line);
}
.image-fallback {
  width:83px;
  height:83px;
  flex-shrink:0;
  border-radius:10px;
  background:#111a2a;
  border:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:6px;
  color:var(--muted);
  font-size:11px;
}
.sprite-name { font-size:16px; font-weight:bold; line-height:1.25; }
.sprite-variant { color:var(--muted); font-size:12px; margin-top:5px; }
.rarity {
  display:inline-block;
  font-size:11px;
  font-weight:bold;
  margin-top:7px;
  padding:4px 8px;
  border-radius:20px;
  background:#303c52;
}
.rarity.Rare { color:#69b6ff; }
.rarity.Epic { color:#c38aff; }
.rarity.Legendary { color:#ffb65c; }
.rarity.Mythic { color:#ffdf6c; }
.checks {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.check {
  display:flex;
  align-items:center;
  gap:7px;
  background:var(--panel2);
  border-radius:8px;
  padding:9px 7px;
  font-size:12px;
  min-width:0;
}
.check input {
  width:19px;
  height:19px;
  flex-shrink:0;
  accent-color:var(--green);
  margin:0;
}
.empty {
  grid-column:1/-1;
  text-align:center;
  padding:35px;
  color:var(--muted);
  background:var(--panel);
  border-radius:12px;
}
.actions {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:20px;
}
.action {
  border:1px solid var(--line);
  color:var(--text);
  background:var(--panel);
  border-radius:9px;
  padding:11px 14px;
  cursor:pointer;
  font-weight:bold;
}
.action:hover,.tab:hover,.filter:hover { filter:brightness(1.2); }
.danger { border-color:#914d58; color:#ff9ba7; }
footer {
  color:var(--muted);
  font-size:11px;
  margin-top:22px;
  text-align:center;
  line-height:1.5;
}
@media(max-width:600px) {
  body { padding:12px; padding-bottom:calc(25px + env(safe-area-inset-bottom)); }
  h1 { font-size:23px; }
  .stats { gap:5px; margin:15px 0; }
  .stat { padding:9px 3px; border-radius:9px; }
  .stat span { font-size:clamp(7px,2vw,9px); letter-spacing:-.35px; }
  .stat b { font-size:clamp(12px,3.5vw,17px); margin-top:5px; }
  .progress { height:5px; margin-top:6px; }
  .controls { grid-template-columns:1fr 1fr; }
  .controls input { grid-column:1/-1; }
  .cards { grid-template-columns:1fr; }
  .sprite-image,.image-fallback { width:76px; height:76px; }
  .tab,.filter { padding:10px 12px; }
}
@media(max-width:360px) {
  body { padding-left:8px; padding-right:8px; }
  .stats { gap:3px; }
  .stat { padding:8px 2px; }
  .stat span { font-size:7px; }
  .stat b { font-size:12px; }
  .check { font-size:11px; padding:8px 5px; }
}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>🎮 Fortnite Sprite Tracker</h1>
  <div class="subtitle">Treasure Hunters • Track your complete Sprite collection</div>
</header>

<section class="stats">
  <div class="stat">
    <span>TOTAL</span><b id="total">42</b>
    <div class="progress"><div id="totalBar"></div></div>
  </div>
  <div class="stat">
    <span>OWNED</span><b id="ownedCount">0/42</b>
    <div class="progress"><div id="ownedBar"></div></div>
  </div>
  <div class="stat">
    <span>MASTERED</span><b id="masteredCount">0/42</b>
    <div class="progress"><div id="masteredBar"></div></div>
  </div>
  <div class="stat">
    <span>FOUND</span><b id="foundCount">0/42</b>
    <div class="progress"><div id="foundBar"></div></div>
  </div>
  <div class="stat">
    <span>WON WITH</span><b id="wonCount">0/42</b>
    <div class="progress"><div id="wonBar"></div></div>
  </div>
</section>

<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="all">Overview</button>
  <button class="tab" data-tab="owned">Owned</button>
  <button class="tab" data-tab="mastered">Mastered</button>
  <button class="tab" data-tab="found">Found</button>
  <button class="tab" data-tab="won">Won With</button>
</nav>

<section class="controls">
  <input id="search" type="search" placeholder="Search Sprites...">
  <select id="rarity">
    <option value="All">All Rarities</option>
    <option value="Rare">Rare</option>
    <option value="Epic">Epic</option>
    <option value="Legendary">Legendary</option>
    <option value="Mythic">Mythic</option>
  </select>
  <select id="variant">
    <option value="All">All Variants</option>
    <option value="Normal">Normal</option>
    <option value="Fortune">Fortune</option>
    <option value="Cursed">Cursed</option>
  </select>
</section>

<div class="view-filters" id="viewFilters">
  <button class="filter active" data-filter="all">All</button>
  <button class="filter" data-filter="remaining">Remaining</button>
  <button class="filter" data-filter="completed">Completed</button>
</div>

<main class="cards" id="cards"></main>

<div class="actions">
  <button class="action" id="exportBtn">Export Backup</button>
  <button class="action" id="importBtn">Import Backup</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <button class="action danger" id="resetBtn">Reset Progress</button>
</div>

<footer>
  Progress saves automatically in this browser.<br>
  Fan-made tracker. Not affiliated with or endorsed by Epic Games.
</footer>
</div>

<script>
const base = [
 ["Halfpeel'd","Rare","halfpeeld",3],
 ["Re-Pete","Rare","re-pete",3],
 ["Barry O'Fish","Rare","barry-o-fish",3],
 ["Wayfinder","Rare","wayfinder",3],
 ["Kelper","Epic","kelper",3],
 ["Exmarks","Epic","exmarks",3],
 ["Lil' Squibbly","Epic","lil-squibbly",3],
 ["Chester","Epic","chester",3],
 ["Lil' Flacko","Legendary","lil-flacko",3],
 ["Transponder Snail","Legendary","transponder-snail",1],
 ["Sweet Dreams","Mythic","sweet-dreams",1],
 ["Plundarrgh","Mythic","plundarrgh",3],
 ["Lil' Uzi Vert Jr.","Mythic","lil-uzi-vert-jr",3],
 ["Mini Miku","Mythic","mini-miku",3],
 ["Squiplash","Epic","squiplash",3],
 ["Zee","Mythic","zee",1]
];


const variants = ["Normal","Fortune","Cursed"];

const variantPrefix = {
  Normal:"",
  Fortune:"fortune-",
  Cursed:"cursed-"
};

// Verified images for the seven new Sprites.
// Original 35 Sprite image URLs remain unchanged.
const newSpriteImages = {
  "mini-miku-Normal":
    "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_LushlyZest_ui_v2_1_Alpha_L.webp",

  "mini-miku-Fortune":
    "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_LushlyZest_Jeweled_ui_v1_1_Alpha_L.webp",

  "mini-miku-Cursed":
    "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_LushlyZest_Cursed_ui_v1_1_Alpha_L.webp",

  "squiplash-Normal":
    "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_PirateCalamari_L.webp",

  "squiplash-Fortune":
    "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_PirateCalamari_Jeweled_L.webp",

  "squiplash-Cursed":
    "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_PirateCalamari_Cursed_L.webp",

  "zee-Normal":
    "https://fortnite.gg/img/x/sprites/icons/T_Icon_BR_Creature_Sprite_ZeroPointPiece_ui_v3_1_Alpha_L.webp"
};

const sprites = [];

base.forEach((item,index) => {
  const [name,rarity,slug,count] = item;

  variants.slice(0,count).forEach(variant => {
    const imageKey = slug+"-"+variant;

    sprites.push({
      id:index+"-"+variant,
      name,
      rarity,
      slug,
      variant,

      // Use verified image for new Sprites,
      // otherwise preserve the original image URL.
      image: newSpriteImages[imageKey] ||
        "https://www.fortnitetools.com/images/sprites/"+
        variantPrefix[variant]+slug+"-sprite.webp"
    });
  });
});

const labels = {
  owned:"Owned",
  mastered:"Mastered",
  found:"Found in Island",
  won:"Won With"
};

const STORAGE_KEY = "fortniteSpriteTracker35";
let data = {};
let activeTab = "all";
let activeFilter = "all";

const $ = id => document.getElementById(id);

function loadData() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    data = saved && typeof saved === "object" ? saved : {};
  } catch(e) {
    data = {};
  }
  sprites.forEach(sprite => {
    if (!data[sprite.id]) {
      data[sprite.id] = {
        owned:false, mastered:false, found:false, won:false
      };
    }
  });
}
function saveData() {
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}
function updateStats() {
  const total = sprites.length;
  $("total").textContent = total;
  $("totalBar").style.width = "100%";
  Object.keys(labels).forEach(key => {
    const count = sprites.filter(s => data[s.id] && data[s.id][key]).length;
    $(key+"Count").textContent = count+"/"+total;
    $(key+"Bar").style.width = (count/total*100)+"%";
  });
}
function isComplete(sprite) {
  return Object.keys(labels).every(k => data[sprite.id][k]);
}
function render() {
  const search = $("search").value.toLowerCase().trim();
  const rarity = $("rarity").value;
  const variant = $("variant").value;

  const visible = sprites.filter(sprite => {
    const d = data[sprite.id];
    if (search && !(sprite.name+" "+sprite.variant).toLowerCase().includes(search)) return false;
    if (rarity !== "All" && sprite.rarity !== rarity) return false;
    if (variant !== "All" && sprite.variant !== variant) return false;

    if (activeTab !== "all" && !d[activeTab]) return false;

    if (activeTab === "all") {
      if (activeFilter === "completed" && !isComplete(sprite)) return false;
      if (activeFilter === "remaining" && isComplete(sprite)) return false;
    } else {
      if (activeFilter === "completed" && !d[activeTab]) return false;
      if (activeFilter === "remaining" && d[activeTab]) return false;
    }
    return true;
  });

  $("cards").innerHTML = "";
  if (!visible.length) {
    $("cards").innerHTML = '<div class="empty">No Sprites match your filters.</div>';
    return;
  }

  visible.forEach(sprite => {
    const d = data[sprite.id];
    const card = document.createElement("article");
    card.className = "sprite-card";

    const top = document.createElement("div");
    top.className = "sprite-top";

    const img = document.createElement("img");
    img.className = "sprite-image";
    img.src = sprite.image;
    img.alt = sprite.name+" "+sprite.variant;
    img.loading = "lazy";
    img.onerror = function() {
      const fallback = document.createElement("div");
      fallback.className = "image-fallback";
      fallback.textContent = "Image unavailable";
      this.replaceWith(fallback);
    };

    const info = document.createElement("div");
    info.innerHTML =
      '<div class="sprite-name"></div>'+
      '<div class="sprite-variant"></div>'+
      '<span class="rarity '+sprite.rarity+'">'+sprite.rarity+'</span>';
    info.querySelector(".sprite-name").textContent = sprite.name;
    info.querySelector(".sprite-variant").textContent = sprite.variant;

    top.append(img,info);
    card.append(top);

    const checks = document.createElement("div");
    checks.className = "checks";

    Object.keys(labels).forEach(key => {
      const label = document.createElement("label");
      label.className = "check";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = !!d[key];
      checkbox.addEventListener("change",() => {
        data[sprite.id][key] = checkbox.checked;
        saveData();
        updateStats();
        render();
      });

      const text = document.createElement("span");
      text.textContent = labels[key];
      label.append(checkbox,text);
      checks.append(label);
    });

    card.append(checks);
    $("cards").append(card);
  });
}

function setTab(tab) {
  activeTab = tab;
  activeFilter = "all";
  document.querySelectorAll(".tab").forEach(button => {
    button.classList.toggle("active",button.dataset.tab === tab);
  });
  document.querySelectorAll(".filter").forEach(button => {
    button.classList.toggle("active",button.dataset.filter === "all");
  });
  render();
}

document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click",() => setTab(button.dataset.tab));
});
document.querySelectorAll(".filter").forEach(button => {
  button.addEventListener("click",() => {
    activeFilter = button.dataset.filter;
    document.querySelectorAll(".filter").forEach(b => {
      b.classList.toggle("active",b === button);
    });
    render();
  });
});
$("search").addEventListener("input",render);
$("rarity").addEventListener("change",render);
$("variant").addEventListener("change",render);

$("exportBtn").addEventListener("click",() => {
  const backup = {
    version:2,
    exported:new Date().toISOString(),
    data
  };
  const blob = new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "fortnite-sprite-tracker-backup.json";
  a.click();
  URL.revokeObjectURL(url);
});

$("importBtn").addEventListener("click",() => $("importFile").click());
$("importFile").addEventListener("change",async event => {
  const file = event.target.files[0];
  if (!file) return;
  try {
    const parsed = JSON.parse(await file.text());
    const imported = parsed.data || parsed;
    if (!imported || typeof imported !== "object") throw new Error("Invalid backup");
    sprites.forEach(sprite => {
      const entry = imported[sprite.id];
      if (entry && typeof entry === "object") {
        Object.keys(labels).forEach(key => {
          data[sprite.id][key] = !!entry[key];
        });
      }
    });
    saveData();
    updateStats();
    render();
    alert("Backup imported successfully!");
  } catch(e) {
    alert("That backup file could not be imported.");
  }
  event.target.value = "";
});

$("resetBtn").addEventListener("click",() => {
  if (!confirm("Are you sure you want to reset all Sprite progress?")) return;
  sprites.forEach(sprite => {
    data[sprite.id] = {owned:false,mastered:false,found:false,won:false};
  });
  saveData();
  updateStats();
  render();
});

loadData();
updateStats();
render();
</script>
</body>
</html>
